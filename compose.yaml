# ============================================================================
# Legal Scout — Docker Compose (Single-Port Architecture)
# ============================================================================
# 2 containers: API (+ frontend), Database
# Everything served on port 80 from one container.
#
# Required .env variables:
#   OPENROUTER_API_KEY, JWT_SECRET_KEY, ADMIN_PASSWORD, DB_PASS
#
# Quick start:
#   cp .env.example .env  # Edit with real values
#   docker compose up -d
# ============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # --------------------------------------------------------------------------
  scout-db:
    image: pgvector/pgvector:pg18-trixie
    container_name: scout-db
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      POSTGRES_USER: ${DB_USER:-scout}
      POSTGRES_PASSWORD: ${DB_PASS:?Set DB_PASS in .env}
      POSTGRES_DB: ${DB_DATABASE:-legalscout}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-scout}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - scout
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  # --------------------------------------------------------------------------
  # FastAPI + Frontend (single container, single port)
  # --------------------------------------------------------------------------
  scout-api:
    container_name: scout-api
    build:
      context: .
      dockerfile: Dockerfile
    image: ${IMAGE_NAME:-scout}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    ports:
      - "${PORT:-80}:8000"
    volumes:
      - ./documents:/documents    # IMPORTANT: host bind mount — data persists here
      - ./logs:/app/logs          # Application logs
    environment:
      DB_HOST: scout-db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-scout}
      DB_PASS: ${DB_PASS:?Set DB_PASS in .env}
      DB_DATABASE: ${DB_DATABASE:-legalscout}
      WAIT_FOR_DB: "True"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY in .env}
      DOCUMENTS_DIR: /documents
      API_HOST: ${API_HOST:-}
      FRONTEND_HOST: ${FRONTEND_HOST:-}
      # Was hardcoded "true", so training was a silent no-op that no .env could
      # switch off. Default is unchanged; it is now overridable for a retrain.
      SKIP_AI_TRAINING: "${SKIP_AI_TRAINING:-true}"
      # Session/company memory. Off unless explicitly enabled.
      LEGAL_SCOUT_MEMORY: "${LEGAL_SCOUT_MEMORY:-false}"
      # Effects ledger (audit of side effects). Off unless explicitly enabled.
      SCOUT_EFFECTS_LEDGER: "${SCOUT_EFFECTS_LEDGER:-false}"
      # Routines (data-defined numbered sequences). Off unless explicitly enabled.
      LEGAL_SCOUT_ROUTINES: "${LEGAL_SCOUT_ROUTINES:-false}"
      # Ride the governing playbook along with a template match instead of
      # hoping the model calls load_skill. Measured OFF: load_skill fired
      # 0/3 on the combined director+shareholder request whose answer sits
      # in the new-company-setup skill. Default off until A/B says otherwise.
      LEGAL_SCOUT_SKILL_ROUTING: "${LEGAL_SCOUT_SKILL_ROUTING:-false}"
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env — run scripts/setup.sh}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@legalscout.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env — run scripts/setup.sh}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      scout-db:
        condition: service_healthy
    networks:
      - scout
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G

networks:
  scout:
    driver: bridge

volumes:
  pgdata:
